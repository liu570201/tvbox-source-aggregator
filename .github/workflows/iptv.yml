name: IPTV Aggregator
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run IPTV Aggregator
        run: npm run start
      - name: Commit and push
        run: |
          git config --global user.name "liu570201"
          git config --global user.email "liu570201@users.noreply.github.com"
          git add iptv.m3u tvbox.json
          git commit -m "Auto update IPTV sources" || echo "No changes to commit"
          git push
